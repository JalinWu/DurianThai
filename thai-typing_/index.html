<script>
    const wordList = [
        "สวัสดี", "ขอบคุณ", "สบายดีไหม", "ภาษาไทย", "กรุงเทพฯ", 
        "กินข้าวหรือยัง", "เรียนภาษาไทย", "สนุกมาก", "ไปไหน", "โชคดี"
    ];
    
    let currentWord = "";
    let score = 0;

    const targetDisplay = document.getElementById('target-text');
    const inputField = document.getElementById('typing-input');
    const feedback = document.getElementById('feedback');
    const scoreDisplay = document.getElementById('score');

    function nextWord() {
        // const randomIndex = Math.floor(Math.random() * wordList.length);
        // currentWord = wordList[randomIndex];
        currentWord = generateThaiPattern();
        targetDisplay.innerText = currentWord;
        inputField.value = "";
        feedback.innerText = "";
    }

    inputField.addEventListener('input', () => {
        const val = inputField.value;
        
        if (val === currentWord) {
            feedback.innerText = "正確！ 👍";
            feedback.style.color = "green";
            score++;
            scoreDisplay.innerText = score;
            setTimeout(nextWord, 800);
        } else if (currentWord.startsWith(val)) {
            feedback.innerText = "打字中...";
            feedback.style.color = "#666";
        } else {
            feedback.innerText = "拼字出錯了唷";
            feedback.style.color = "red";
        }
    });

    function resetGame() {
        score = 0;
        scoreDisplay.innerText = score;
        nextWord();
    }

    function generateThaiPattern() {
        // 泰文子音的 Unicode 範圍：0x0E01 (ก) 到 0x0E2E (ฮ)
        const thaiConsonants = [];
        for (let i = 0x0E01; i <= 0x0E2E; i++) {
            thaiConsonants.push(String.fromCharCode(i));
        }

        // 隨機選取兩個索引
        const idx1 = Math.floor(Math.random() * thaiConsonants.length);
        let idx2 = Math.floor(Math.random() * thaiConsonants.length);

        // 確保兩個子音不重複（可選）
        while (idx1 === idx2) {
            idx2 = Math.floor(Math.random() * thaiConsonants.length);
        }

        const char1 = thaiConsonants[idx1];
        const char2 = thaiConsonants[idx2];

        // 回傳格式：4個相同子音 + 空格 + 4個相同子音
        return `${char1.repeat(4)} ${char2.repeat(4)}`;
    }

    // 測試呼叫
    // console.log(generateThaiPattern());

    // 初始化
    window.onload = nextWord;
</script>

<script>
const toggleBtn = document.getElementById('toggle-btn');
const btnText = toggleBtn.querySelector('.btn-text');
const btnIcon = toggleBtn.querySelector('i');

let isRunning = false;

toggleBtn.addEventListener('click', function() {
  isRunning = !isRunning;

  if (isRunning) {
    // 切換為「停止」狀態
    this.classList.add('is-active');
    btnText.textContent = '停止';
    
    // 更新 Icon (以 FontAwesome 為例)
    btnIcon.classList.remove('fa-play');
    btnIcon.classList.add('fa-stop');
    
    console.log('計時開始...');
  } else {
    // 切換回「開始」狀態
    this.classList.remove('is-active');
    btnText.textContent = '開始';
    
    btnIcon.classList.remove('fa-stop');
    btnIcon.classList.add('fa-play');
    
    console.log('計時停止');
  }
});

// 跳過按鈕邏輯
document.getElementById('skip-btn').addEventListener('click', () => {
  console.log('跳過當前項目');
});

document.addEventListener('keydown', function(event) {
  const typingInput = document.getElementById('typing-input');

  // 1. 檢查目前焦點是否已經在輸入框內，如果是，就不重複處理
  if (document.activeElement === typingInput) return;

  // 2. 排除特殊功能鍵（如 F1-F12, Alt, Ctrl, Meta, Shift, Tab, Escape 等）
  // 我們只想在使用者按下「可輸入字元」時才觸發對焦
  if (event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
    
    // 自動對焦到輸入框
    typingInput.focus();
    
    /* 注意：在某些瀏覽器中，這第一個按下的字元可能不會自動填入
       若發現第一個字漏掉了，可以用以下方式補上：
       typingInput.value += event.key;
       event.preventDefault(); 
    */
  }
});
